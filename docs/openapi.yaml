openapi: 3.1.0
info:
  title: MAA Control Center API
  version: 0.2.0
  description: Reviewed configuration plans with local Windows safety checks; MAA task dispatch remains disabled. All dates use RFC3339 UTC. See docs/agent-mode.md for operation scopes and setup.
servers:
  - url: /
security:
  - session: []
paths:
  /api/v1/integrations:
    get:
      summary: Encrypted integration settings, returned without keys; configured booleans only
      responses:
        '200': {description: 'provider, channels[], creative; no API or channel secrets'}
    put:
      security: [{session: [], csrf: []}]
      summary: Save provider and Telegram/QQ settings; blank key preserves, clear_key removes
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [provider, channels, creative]}
      responses:
        '200': {description: Encrypted settings saved}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/integrations/provider/test:
    post:
      security: [{session: [], csrf: []}]
      summary: Explicitly call saved exact model and verify JSON capability
      responses:
        '200': {description: 'ok, model'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/integrations/notifications/test:
    post:
      security: [{session: [], csrf: []}]
      summary: Queue a clearly marked test for enabled saved channels
      responses:
        '202': {description: Test queued}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/integrations/notifications:
    get:
      summary: Last 100 persistent delivery receipts
      responses:
        '200': {description: 'id, event_id, channel, state, detail, message, created_at'}
  /api/v1/integrations/notifications/{id}/retry:
    parameters: [{$ref: '#/components/parameters/ResourceID'}]
    post:
      security: [{session: [], csrf: []}]
      summary: Retry failed/unknown delivery only with confirm=true; duplicates possible
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [confirm], properties: {confirm: {const: true}}}
      responses:
        '202': {description: Explicit retry queued}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/assistant/rules:
    get:
      summary: Versioned MAA field catalog and invariants
      responses:
        '200': {description: Machine readable maa-6.20-r1 catalog}
  /api/v1/accounts/{id}/assistant/propose:
    parameters: [{$ref: '#/components/parameters/AccountID'}]
    post:
      security: [{session: [], csrf: []}]
      summary: Call configured model using redacted context and validate proposal, without applying
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [intent, target]
              properties:
                intent: {type: string, maxLength: 2000}
                target: {enum: [config, schedule]}
      responses:
        '201': {description: Draft with operations and deterministic diff, expires in 10 minutes}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/accounts/{id}/config/preview:
    parameters: [{$ref: '#/components/parameters/AccountID'}]
    post:
      security: [{session: [], csrf: []}]
      summary: Validate structured target and operations without a model call; never applies
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [target, operations]}
      responses:
        '201': {description: Draft with reviewed diff}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/config/plans:
    get:
      summary: Most recent 100 configuration drafts and outcomes
      responses:
        '200': {description: Independent per-account plan records}
  /api/v1/config/plans/{id}/approve:
    parameters: [{$ref: '#/components/parameters/ResourceID'}]
    post:
      security: [{session: [], csrf: []}]
      summary: Approve exact plan ID after reviewing diff; requires stopped MAA, unchanged source and opted-in Windows agent
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [confirm], properties: {confirm: {type: string}}}
      responses:
        '202': {description: Approved and queued for Windows revalidation}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/config/plans/{id}/rollback:
    parameters: [{$ref: '#/components/parameters/ResourceID'}]
    post:
      security: [{session: [], csrf: []}]
      summary: Create reverse diff draft; requires separate approval, matching applied hash and local backup
      responses:
        '201': {description: Rollback draft, not applied}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/config/plans/{id}/cancel:
    parameters: [{$ref: '#/components/parameters/ResourceID'}]
    post:
      security: [{session: [], csrf: []}]
      summary: Cancel a draft or still-queued plan; dispatched operations cannot be revoked
      responses:
        '200': {description: Cancelled}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/agent/config/commands:
    get:
      security: [{agentToken: []}]
      summary: Read approved commands for paired agent; retry uses same ID and durable local journal
      responses:
        '200': {description: Up to four commands, each bound to discovered instance/profile and reviewed diff}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/agent/config/receipts:
    post:
      security: [{agentToken: []}]
      summary: Persist terminal configuration outcome and enqueue idempotent notifications
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [id, state, message, before_hash, after_hash, time]}
      responses:
        '200': {description: Outcome persisted}
        '422': {$ref: '#/components/responses/Error'}
  /health:
    get:
      security: []
      summary: Application and SQLite health
      responses:
        '200': {description: 'Healthy; status, version, mode'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/auth/login:
    post:
      security: []
      summary: Login; validates origin and applies per-client rate limit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string, format: password}
      responses:
        '200': {description: 'HttpOnly SameSite=Strict session cookie; JSON csrf_token for subsequent writes'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /api/v1/auth/session:
    get:
      summary: Current admin session and CSRF token
      responses:
        '200': {description: 'username and csrf_token'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/auth/logout:
    post:
      security: [{session: [], csrf: []}]
      summary: Revoke session and expire cookie
      responses:
        '200': {description: Session revoked}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/overview:
    get:
      summary: Real accounts, agents, events, empty production queue and server time
      responses:
        '200': {description: 'accounts[], agents[], events[], jobs[], server_time, mode, version'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/accounts:
    get:
      summary: Independent account observations
      responses:
        '200':
          description: Account list
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Account'}}
  /api/v1/accounts/{id}/status:
    parameters: [{$ref: '#/components/parameters/AccountID'}]
    get:
      summary: Single account; process presence never proves running task
      responses:
        '200': {description: Account observation}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/accounts/{id}/policies:
    parameters: [{$ref: '#/components/parameters/AccountID'}]
    get:
      summary: Observed policy, required constraints and writable=false
      responses:
        '200': {description: 'observed, required, writable'}
    put:
      security: [{session: [], csrf: []}]
      summary: Production writes are disabled
      responses:
        '423': {$ref: '#/components/responses/Error'}
  /api/v1/accounts/{id}/policies/preview:
    parameters: [{$ref: '#/components/parameters/AccountID'}]
    post:
      security: [{session: [], csrf: []}]
      summary: Preview original and proposed budget without saving
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Policy'}
      responses:
        '200': {description: 'original, proposed, valid, errors[], applicable=false'}
        '400': {$ref: '#/components/responses/Error'}
  /api/v1/accounts/{id}/binding:
    parameters: [{$ref: '#/components/parameters/AccountID'}]
    post:
      security: [{session: [], csrf: []}]
      summary: Confirm an actually discovered profile; writes only Web database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, instance_id, profile_id]
              properties:
                agent_id: {type: string}
                instance_id: {type: string}
                profile_id: {type: string}
      responses:
        '200': {description: Read-only binding saved}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/accounts/{id}/inventory:
    parameters: [{$ref: '#/components/parameters/AccountID'}]
    get:
      summary: Existing targets; unattributed current inventory remains null
      responses:
        '200': {description: 'items[], source, stale=true, message'}
  /api/v1/accounts/{id}/schedule:
    parameters: [{$ref: '#/components/parameters/AccountID'}]
    get:
      summary: Original per-profile base schedule with extension fields preserved
      responses:
        '200': {description: 'schedule or null, read_only=true, source'}
  /api/v1/accounts/{id}/logs:
    parameters: [{$ref: '#/components/parameters/AccountID'}]
    get:
      summary: Redacted instance log tail, not an inferred per-account log
      responses:
        '200': {description: 'lines[], redacted=true'}
  /api/v1/events:
    get:
      summary: Up to 200 most recent Control Center events
      responses:
        '200': {description: 'id, time, level, account_id, message'}
  /api/v1/agents:
    get:
      summary: Discovered installations and profiles; never returns pairing token
      responses:
        '200': {description: Agent observations}
  /api/v1/settings:
    get:
      summary: Read-only system capabilities without secrets
      responses:
        '200': {description: System capability flags}
  /api/v1/jobs:
    get:
      summary: Production queue; empty in read-only MVP
      responses:
        '200': {description: Empty array}
    post:
      security: [{session: [], csrf: []}]
      summary: Live task dispatch remains locked
      responses:
        '423': {$ref: '#/components/responses/Error'}
  /api/v1/jobs/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    get:
      summary: No live jobs exist in read-only MVP
      responses:
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/jobs/{id}/cancel:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    post:
      security: [{session: [], csrf: []}]
      summary: Live cancellation remains locked
      responses:
        '423': {$ref: '#/components/responses/Error'}
  /api/v1/agent/heartbeat:
    post:
      security: [{agentToken: []}]
      summary: Pre-paired Agent read-only heartbeat; 2 MiB maximum
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, hostname, os, version, instances]
              properties:
                agent_id: {type: string}
                hostname: {type: string, maxLength: 128}
                os: {type: string}
                version: {type: string}
                instances: {type: array, maxItems: 16, items: {type: object}}
      responses:
        '200': {description: 'accepted=true, mode=read_only, server_time'}
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /maa/remote/getTask:
    post:
      security: []
      summary: Official protocol endpoint reserved but disabled; user/device are not authentication
      responses:
        '423': {$ref: '#/components/responses/Error'}
  /maa/remote/reportStatus:
    post:
      security: []
      summary: Official report endpoint reserved but disabled
      responses:
        '423': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    session: {type: apiKey, in: cookie, name: maacc_session}
    csrf: {type: apiKey, in: header, name: X-CSRF-Token}
    agentToken: {type: http, scheme: bearer}
  parameters:
    ResourceID: {name: id, in: path, required: true, schema: {type: string, pattern: "^[a-f0-9]{64}$"}}
    AccountID: {name: id, in: path, required: true, schema: {type: string, enum: [primary, secondary]}}
  schemas:
    Account:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        role: {type: string}
        status: {type: string, enum: [offline, idle, queued, running, stopping, unknown, error]}
        bound: {type: boolean}
        agent_online: {type: boolean}
        last_seen: {type: string}
        instance: {type: [object, 'null']}
        profile: {type: [object, 'null']}
        policy: {$ref: '#/components/schemas/Policy'}
    Policy:
      type: object
      properties:
        medicine_budget: {type: [integer, 'null'], minimum: 0, maximum: 10000}
        stone_budget: {type: [integer, 'null'], minimum: 0, maximum: 10000}
        expiring_hours: {type: [integer, 'null'], enum: [0, 48, null]}
        source: {type: string}
        verified: {type: boolean}
    Error:
      type: object
      required: [error, message]
      properties:
        error: {type: string, description: 'unauthorized, csrf, read_only, not_paired, invalid_json, binding_invalid, storage_error, rate_limited, not_found'}
        message: {type: string}
  responses:
    Error:
      description: Request rejected; no production operation is performed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
