name: Build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash scripts/build.sh
      - run: go test -race ./...
      - run: go vet ./...
      - run: python -m pip install -r integrations/astrbot_plugin_maa_control/requirements.txt
      - run: python -m unittest discover -s integrations/astrbot_plugin_maa_control -p 'test_*.py'
      - run: python -m pip install -r integrations/astrbot_plugin_skland/requirements.txt
      - run: python -m unittest discover -s integrations/astrbot_plugin_skland/tests
